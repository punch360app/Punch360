name: Punch 360 safe visual review
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/live/**'
      - '.github/workflows/visual-review.yml'
      - '.github/scripts/visual-*.cjs'
      - 'visual-baselines/**'
  push:
    branches: [main]
    paths:
      - 'web/live/**'
      - '.github/workflows/visual-review.yml'
      - '.github/scripts/visual-*.cjs'
      - 'visual-baselines/**'
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: punch-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install app dependencies without modifying product manifests
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install screenshot and PNG tools without saving a lockfile
        run: npm install --no-save --no-package-lock playwright@1.56.0 pngjs@7.0.0
      - name: Verify comparison, approvals and recommendations
        run: node --test .github/scripts/visual-feedback.test.cjs
      - name: Verify deduplicated Work issue handoff contract
        run: node --test .github/scripts/visual-issue.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Serve the real Punch Web interface locally
        run: |
          python3 -m http.server 8765 -d web/live > /tmp/punch-visual-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/punch-visual-server.log
          exit 1
      - name: Exercise and capture public onboarding journeys on phone, tablet and PC
        run: node .github/scripts/visual-capture.cjs
      - name: Verify all 24 distinct public screen states were visited
        run: |
          node -e "const fs=require('fs');const p='visual-captures/functional-journeys.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));if(x.visits!==24||new Set(x.results.map(r=>r.image)).size!==24){console.error('Incomplete public journey coverage',x.visits);process.exit(1)};for(const r of x.results){if(!fs.statSync('visual-captures/'+r.image).size)process.exit(1)}"
      - name: Compare owner-approved screenshot baselines and create Work recommendations
        if: always()
        run: node .github/scripts/visual-compare.cjs
      - name: Verify deliverable files in the visual report
        if: always()
        run: |
          node -e "const fs=require('fs');for(const n of ['review.html','report.json','WORK_VISUAL_FIX.md']){const p='visual-captures/'+n;if(!fs.existsSync(p)||!fs.statSync(p).size)throw Error('Missing artifact file: '+p)}"
      - name: Preserve screenshots, diffs, HTML and Work repair instructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punch-visual-captures
          path: visual-captures/
          retention-days: 14
          if-no-files-found: warn

  publish-work-handoff:
    name: Handoff visual findings to one GitHub issue
    needs: capture-and-compare
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: punch-visual-captures
          path: visual-captures
      - name: Create or update one deduplicated GitHub issue for Work
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/visual-issue.cjs
