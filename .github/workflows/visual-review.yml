name: Punch 360 safe visual review
on:
  pull_request:
    # Include the live parent of PR #261 so its real Bento screens are tested
    # before the stacked PR is merged; retain fail-closed checks and all captures.
    branches: [main, feat/public-compact-vitrine-20261028]
    paths:
      - 'web/live/**'
      - '.github/workflows/visual-review.yml'
      - '.github/scripts/visual-*.cjs'
      - 'visual-baselines/**'
  push:
    branches: [main]
    paths:
      - 'web/live/**'
      - '.github/workflows/visual-review.yml'
      - '.github/scripts/visual-*.cjs'
      - 'visual-baselines/**'
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: punch-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/punch-visual-deps/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Classify changed paths; unknown or production changes always require 24 captures
        id: visual-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" &&
                "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" &&
               git diff --name-only "$BASE_SHA" HEAD > /tmp/punch-visual-changes; then
              mode=$(node .github/scripts/visual-impact.cjs /tmp/punch-visual-changes)
            else
              echo "Cannot verify PR diff; running full browser coverage."
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Visual review mode: $mode"
      - name: Check risk classification fail-closed contract
        run: node --test .github/scripts/visual-impact.test.cjs
      - name: Explain fast path; no screenshot or Figma approval is inferred
        if: steps.visual-scope.outputs.mode == 'fast'
        run: |
          echo '### Visual scope — no browser setup necessary' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only explicitly allowlisted pure business helpers and unit tests changed; application TypeScript + all unit tests run separately in the mandatory PUNCH TypeScript workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No visual verification or Figma design approval claimed. Full 24-screen review remains mandatory on main and for every UI/CSS/unknown diff.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install only visual tooling (no Expo npm ci, no product manifest changes)
        if: steps.visual-scope.outputs.mode == 'full'
        run: |
          mkdir -p /tmp/punch-visual-deps
          npm install --prefix /tmp/punch-visual-deps --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.0 pngjs@7.0.0
      - name: Cache Chromium headless shell across PRs and main
        if: steps.visual-scope.outputs.mode == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: punch-chromium-headless-1.56.0-${{ runner.os }}-${{ runner.arch }}
      - name: Verify comparison, approvals and recommendations
        if: steps.visual-scope.outputs.mode == 'full'
        run: node --test .github/scripts/visual-feedback.test.cjs
      - name: Verify deduplicated Work issue handoff contract
        if: steps.visual-scope.outputs.mode == 'full'
        run: node --test .github/scripts/visual-issue.test.cjs
      - name: Verify Figma evidence pack from authentic browser images
        if: steps.visual-scope.outputs.mode == 'full'
        run: node --test .github/scripts/visual-figma-pack.test.cjs
      - name: Ensure only Chromium headless shell and required system libraries
        if: steps.visual-scope.outputs.mode == 'full'
        run: node /tmp/punch-visual-deps/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Serve the real Punch Web interface locally
        if: steps.visual-scope.outputs.mode == 'full'
        run: |
          python3 -m http.server 8765 -d web/live > /tmp/punch-visual-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/punch-visual-server.log
          exit 1
      - name: Exercise and capture public onboarding journeys on phone, tablet and PC
        if: steps.visual-scope.outputs.mode == 'full'
        run: node .github/scripts/visual-capture.cjs
      - name: Verify all 24 distinct public screen states were visited
        if: steps.visual-scope.outputs.mode == 'full'
        run: |
          node -e "const fs=require('fs');const p='visual-captures/functional-journeys.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));if(x.visits!==24||new Set(x.results.map(r=>r.image)).size!==24){console.error('Incomplete public journey coverage',x.visits);process.exit(1)};for(const r of x.results){if(!fs.statSync('visual-captures/'+r.image).size)process.exit(1)}"
      - name: Create three Figma-ready contact sheets with source hashes (never approve)
        if: steps.visual-scope.outputs.mode == 'full'
        run: node .github/scripts/visual-figma-pack.cjs
      - name: Validate Figma handoff files are present
        if: steps.visual-scope.outputs.mode == 'full'
        run: |
          node -e "const fs=require('fs');const p='visual-captures/';for(const n of ['figma-contact-S25.png','figma-contact-iPad.png','figma-contact-PC.png','figma-handoff.json','FIGMA_HANDOFF.md']){if(!fs.existsSync(p+n)||!fs.statSync(p+n).size)throw Error('Missing Figma evidence: '+n)}"
      - name: Compare owner-approved screenshot baselines and create Work recommendations
        if: ${{ always() && steps.visual-scope.outputs.mode == 'full' }}
        run: node .github/scripts/visual-compare.cjs
      - name: Verify deliverable files in the visual report
        if: ${{ always() && steps.visual-scope.outputs.mode == 'full' }}
        run: |
          node -e "const fs=require('fs');for(const n of ['review.html','report.json','WORK_VISUAL_FIX.md']){const p='visual-captures/'+n;if(!fs.existsSync(p)||!fs.statSync(p).size)throw Error('Missing artifact file: '+p)}"
      - name: Preserve screenshots, diffs, HTML and Work repair instructions
        if: ${{ always() && steps.visual-scope.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: punch-visual-captures
          path: visual-captures/
          retention-days: 14
          if-no-files-found: warn

  publish-work-handoff:
    name: Handoff visual findings to one GitHub issue
    needs: capture-and-compare
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: punch-visual-captures
          path: visual-captures
      - name: Create or update one deduplicated GitHub issue for Work
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/visual-issue.cjs
