name: PUNCH 360 Web
on:
  push:
    branches: [main]
    paths:
      - "web/live/**"
      - ".github/workflows/deploy-web.yml"
      - "docs/prompt-board/MASTER_PROMPT_20261025.md"
      - "scripts/sync-tracker-master.mjs"
  workflow_dispatch:
  # GITHUB_TOKEN progress commits do not emit another push workflow.
  # Publish only after the register writer has finished, using trusted main.
  workflow_run:
    workflows: ["PUNCH Work progress register"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: punch-web-pages
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - name: Generate tracker from current master
        run: node scripts/sync-tracker-master.mjs
      - name: Validate frontend JavaScript
        run: |
          node --check web/live/app.js
          node scripts/validate-tracker-html.mjs
      - name: Diagnose social sign-in providers
        run: node scripts/check-oauth-providers.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web/live
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
