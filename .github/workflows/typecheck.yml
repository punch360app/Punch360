name: PUNCH TypeScript
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify Expo dependencies
        run: npx expo install --check
      - name: TypeScript
        run: npm run check
      - name: Offline journal and UI tests
        run: npm test
      - name: Web syntax
        run: node --check web/live/app.js && node --check web/live/journal.js && node --check web/live/sw.js
